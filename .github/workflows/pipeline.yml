name: MLOps pipeline

on:
  # workflow_dispatch:
  push:
   branches:
    - main  # Automatically triggers on push to the main branch
jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r master/requirements.txt
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOK: ${{ secrets.HF_TOK }}
        run: python master/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r master/requirements.txt
      - name: Run Data Preparation
        env:
          HF_TOK: ${{ secrets.HF_TOK }}
        run: python master/model_building/prep.py


  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r master/requirements.txt
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server start
      - name: Model Building
        env:
          HF_TOK: ${{ secrets.HF_TOK }}
        run: python master/model_building/train.py
        
      - name: Save MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-traning,data-prep,register-dataset]
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: pip install -r master/requirements.txt
      - name: Push files to Frontend Hugging Face Space
        env:
          HF_TOK: ${{ secrets.HF_TOK }}
        run: python master/hosting/hosting.py
